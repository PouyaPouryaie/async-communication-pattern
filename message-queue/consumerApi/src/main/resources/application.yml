spring:
  application:
    name: consumerApi
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:order_events_user}
    password: ${RABBITMQ_PASSWORD:order_events_pass}
    virtual-host: ${RABBITMQ_VHOST:order-events}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:consumerdb}
    username: ${DB_USER:consumer_user}
    password: ${DB_PASSWORD:consumer_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 1

logging:
  level:
    ir.bigz.messagequeue.consumer: INFO
