<div class="polling-container">
  <h2>Order Polling Management</h2>

  <!-- Input Form -->
  <div class="form-group">
    <label for="orderNumber">Order Number:</label>
    <input
      id="orderNumber"
      type="number"
      [(ngModel)]="orderNumber"
      [disabled]="isPolling()"
      placeholder="Enter order ID"
      />
  </div>

  <div class="form-group">
    <label for="orderType">Order Type:</label>
    <select id="orderType" [(ngModel)]="orderType" [disabled]="isPolling()">
      <option value="INTERNAL">INTERNAL (Short Polling)</option>
      <option value="EXTERNAL">EXTERNAL (Long Polling)</option>
    </select>
  </div>

  <button (click)="startOrderProcess()" [disabled]="isPolling() || !orderNumber">
    {{ isPolling() ? 'Processing & Polling...' : 'Submit & Poll' }}
  </button>

  <!-- Status Display Box -->
  @if (currentStatus()) {
    <div class="status-box" [ngClass]="getStatusClass(currentStatus()!)">
      <h3>Current Status: {{ currentStatus() }}</h3>
      <p>{{ statusMessage() }}</p>
    </div>
  }

  @if (errorMessage()) {
    <div class="error-box">
      <p>{{ errorMessage() }}</p>
    </div>
  }
</div>
